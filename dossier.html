<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockwork vs Chaos — Dossier</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #101820;
    --ink-soft: #5f6f7d;
    --line: #d6dde4;
    --line-soft: #e9edf1;
    --paper: #fffdf9;
    --sheet: #e6ebf1;
    --chrome: #16202b;
    --amber: #ffb020;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px 16px 56px;
    background:
      radial-gradient(900px 520px at 50% -8%, #f5f8fb 0%, rgba(245, 248, 251, 0) 60%),
      linear-gradient(180deg, #eaeef4 0%, #e2e8ef 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* -------------------------------------------------------------- toolbar -- */

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0 0 18px;
  }

  .toolbar button {
    padding: 9px 18px;
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 9px;
    background: linear-gradient(180deg, #1d2b39 0%, #121b25 100%);
    color: #eef1f4;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(10, 16, 23, .22);
  }

  .toolbar button:hover { background: linear-gradient(180deg, #27394a 0%, #1a2632 100%); }

  /* ---------------------------------------------------------------- sheet -- */

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 20px;
    background: var(--paper);
    border-top: 3mm solid var(--chrome);
    box-shadow:
      0 2px 6px rgba(16, 24, 32, .14),
      0 24px 48px rgba(16, 24, 32, .12);
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }

  .page:last-child { page-break-after: auto; break-after: auto; }

  .page-body {
    flex: 1;
    padding: 6mm 18mm 8mm;
  }

  .page-body > h3:first-child,
  .page-body > h2:first-child { margin-top: 0; }

  .page-head {
    display: flex;
    align-items: center;
    gap: 3mm;
    margin: 0 18mm;
    padding: 10mm 0 2.5mm;
    border-bottom: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 7.5pt;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .page-head img {
    display: block;
    width: 5.5mm;
    height: 5.5mm;
    border-radius: 1.2mm;
  }

  .page-head .head-brand { color: var(--ink); }

  .page-head .head-section {
    margin-left: auto;
    color: var(--ink);
  }

  .page--cover .page-body { padding: 16mm 18mm 8mm; }

  .page-foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8mm;
    margin: 0 18mm 9mm;
    padding-top: 3mm;
    border-top: 1px solid var(--line-soft);
    font-family: var(--mono);
    font-size: 8pt;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .page-foot .foot-num { color: var(--ink); flex: none; }

  /* ----------------------------------------------------------------- cover -- */

  .page--cover .page-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .cover-watermark {
    display: none;
  }

  .page--cover::before {
    content: "";
    position: absolute;
    inset: 8mm;
    border: 1px solid var(--line);
    border-radius: 1.5mm;
    pointer-events: none;
  }

  .cover-logo img {
    display: block;
    width: 26mm;
    height: 26mm;
    border-radius: 5mm;
    box-shadow: 0 2mm 6mm rgba(16, 24, 32, .18);
  }

  .kicker {
    margin: 9mm 0 0;
    font-family: var(--mono);
    font-size: 8.5pt;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .cover-title {
    margin: 4mm 0 3mm;
    font-family: var(--serif);
    font-size: 34pt;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -.01em;
    max-width: 150mm;
  }

  .byline {
    margin: 0;
    font-size: 11pt;
    color: var(--ink-soft);
  }

  .facts {
    display: flex;
    gap: 9mm;
    margin: 12mm 0 0;
    padding: 5mm 8mm;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .facts div { text-align: center; }

  .facts dt {
    font-family: var(--mono);
    font-size: 7.5pt;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .facts dd {
    margin: 1.5mm 0 0;
    font-family: var(--serif);
    font-size: 17pt;
  }

  .cover-foot {
    margin: 14mm 0 0;
    font-family: var(--mono);
    font-size: 8pt;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* -------------------------------------------------------------- headings -- */

  .page h2 {
    display: flex;
    align-items: center;
    gap: 3mm;
    margin: 0 0 7mm;
    padding-bottom: 3mm;
    border-bottom: 1.4pt solid var(--ink);
    font-size: 11pt;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  .page h2::before {
    content: "";
    width: 3mm;
    height: 3mm;
    flex: none;
    border-radius: .6mm;
    background: var(--amber);
  }

  .page h3 {
    margin: 8mm 0 3mm;
    font-family: var(--mono);
    font-size: 8.5pt;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ------------------------------------------------------------------ map -- */

  .figure { margin: 0; }

  .board-figure {
    display: grid;
    grid-template-columns: 8mm minmax(0, 1fr);
    grid-template-rows: 8mm auto;
    gap: 2mm;
    break-inside: avoid;
  }

  .fig-cols {
    grid-area: 1 / 2 / 2 / 3;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    text-align: center;
  }

  .fig-rows {
    grid-area: 2 / 1 / 3 / 2;
    display: grid;
    grid-template-rows: repeat(5, 1fr);
    align-items: center;
    text-align: center;
  }

  .fig-cols span,
  .fig-rows span {
    font-family: var(--mono);
    font-size: 7.5pt;
    letter-spacing: .1em;
    color: var(--ink-soft);
  }

  .map {
    grid-area: 2 / 2 / 3 / 3;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2.5mm;
    padding: 3mm;
    background: #f6f8fa;
    border: 1px solid var(--line);
    border-radius: 2.5mm;
  }

  .slot {
    aspect-ratio: 1;
    border-radius: 1.5mm;
    overflow: hidden;
  }

  .slot svg { display: block; width: 100%; height: 100%; }

  .slot.empty {
    background: repeating-linear-gradient(45deg, #ffffff 0 1.4mm, #eef1f4 1.4mm 2.8mm);
    box-shadow: inset 0 0 0 1px var(--line-soft);
  }

  .fig-cap {
    display: flex;
    justify-content: space-between;
    gap: 6mm;
    margin: 3mm 0 0;
    font-family: var(--mono);
    font-size: 7.5pt;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---------------------------------------------------------------- prose -- */

  .para {
    margin: 0 0 3.5mm;
    font-family: var(--serif);
    font-size: 11pt;
    line-height: 1.68;
  }

  .callout .para:last-child { margin-bottom: 0; }

  .topic-list {
    margin: 0 0 6mm;
    padding-left: 5mm;
    font-family: var(--sans);
    font-size: 10pt;
    line-height: 1.7;
  }

  .topic-list li { margin-bottom: 1mm; }

  .callout {
    padding: 5mm 6mm;
    background: #fbf6ea;
    border-left: 1.2mm solid var(--amber);
    border-radius: 0 1.5mm 1.5mm 0;
  }

  .muted { color: var(--ink-soft); }

  /* ---------------------------------------------------------------- tiles -- */

  .tile-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5mm;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .tile-card {
    display: flex;
    align-items: center;
    gap: 5mm;
    padding: 4mm;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 2.5mm;
    break-inside: avoid;
  }

  .tile-card .art { width: 26mm; flex: none; aspect-ratio: 1; }

  .tile-meta { display: flex; flex-direction: column; gap: 1.5mm; }
  .tile-meta strong { font-size: 12pt; letter-spacing: .1em; }
  .tile-meta span {
    font-family: var(--mono);
    font-size: 8pt;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* --------------------------------------------------------------- figure -- */

  .setup-frame {
    padding: 3mm;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 2mm;
    break-inside: avoid;
  }

  .setup-frame img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 1mm;
  }

  .page--setup .page-body {
    padding-top: 6mm;
  }

  .figure-wrap { margin: 0; }

  /* --------------------------------------------------------------- notice -- */

  .notice {
    max-width: 460px;
    margin: 18vh auto 0;
    padding: 20px 24px;
    background: #fffdf7;
    border-left: 4px solid var(--amber);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(16, 24, 32, .12);
    font-size: 14px;
    line-height: 1.55;
  }

  /* ---------------------------------------------------------------- print -- */

  @media print {
    @page { size: A4; margin: 0; }

    html, body { background: #ffffff; }

    body { padding: 0; }

    .toolbar { display: none; }

    .page {
      margin: 0;
      width: auto;
      min-height: 297mm;
      box-shadow: none;
    }

    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }

  /* The sheet always stays A4 — also in a narrow browser window — so the
     preview and the printed page measure the same and pagination holds. */
  @media screen and (max-width: 900px) {
    body { padding: 12px 6px 40px; }
    .toolbar { padding-bottom: 12px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-print" type="button">Print / Save as PDF</button>
</div>

<div id="pages"></div>

<script src="js/tiles.js"></script>
<script src="js/render.js"></script>
<script src="js/print.js"></script>
</body>
</html>
