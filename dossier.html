<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slickworks — Dossier</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
  :root {
    --ink: #101820;
    --ink-soft: #5a6b7a;
    --line: #d5dce4;
    --paper: #ffffff;
    --sheet: #eef1f4;
    --amber: #ffb020;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 56px;
    background: var(--sheet);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 0 0 16px;
  }

  .toolbar button {
    padding: 8px 16px;
    border: 0;
    border-radius: 8px;
    background: #16202b;
    color: #eef1f4;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  .toolbar button:hover { background: #24374a; }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 18px;
    padding: 20mm 18mm;
    background: var(--paper);
    box-shadow: 0 2px 6px rgba(16, 24, 32, .12), 0 18px 40px rgba(16, 24, 32, .10);
    page-break-after: always;
    break-after: page;
  }

  .page:last-child { page-break-after: auto; break-after: auto; }

  /* cover */

  .cover {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-top: 8px solid var(--ink);
  }

  .cover-mark img { display: block; border-radius: 16px; }

  .kicker {
    margin: 18px 0 0;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .cover h1 {
    margin: 10px 0 6px;
    font-family: var(--serif);
    font-size: 40px;
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  .byline {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
  }

  .facts {
    display: flex;
    gap: 34px;
    margin: 34px 0 0;
    padding: 14px 24px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .facts div { text-align: center; }

  .facts dt {
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .facts dd {
    margin: 4px 0 0;
    font-family: var(--serif);
    font-size: 22px;
  }

  .cover-foot {
    margin-top: 40px;
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--ink-soft);
  }

  /* headings */

  .page h2 {
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--ink);
    font-size: 13px;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  .page h3 {
    margin: 22px 0 8px;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* map */

  .map {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3mm;
    padding: 3mm;
    background: #f2f5f8;
    border-radius: 4px;
    break-inside: avoid;
  }

  .slot svg { display: block; width: 100%; height: auto; }

  .slot.empty {
    aspect-ratio: 1;
    background: repeating-linear-gradient(45deg, #fff 0 6px, #eef1f4 6px 12px);
    border-radius: 4px;
  }

  /* prose */

  .prose {
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.65;
  }

  .prose p { margin: 0 0 10px; }

  .muted { color: var(--ink-soft); }

  /* legend */

  .legend-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8mm 6mm;
  }

  .legend-list li {
    display: flex;
    align-items: center;
    gap: 4mm;
    break-inside: avoid;
  }

  .legend-art { width: 26mm; flex: none; }
  .legend-art svg { display: block; width: 100%; height: auto; }

  .legend-meta { display: flex; flex-direction: column; gap: 2px; }
  .legend-meta strong { font-size: 13px; letter-spacing: .06em; }
  .legend-meta span { font-size: 11px; color: var(--ink-soft); }

  .notice {
    max-width: 460px;
    margin: 18vh auto 0;
    padding: 20px 24px;
    background: #fff;
    border-left: 4px solid var(--amber);
    border-radius: 6px;
    box-shadow: 0 8px 26px rgba(16, 24, 32, .1);
    font-size: 14px;
    line-height: 1.55;
  }

  @media print {
    @page { size: A4; margin: 0; }
    body { padding: 0; background: #fff; }
    .toolbar { display: none; }
    .page {
      margin: 0;
      box-shadow: none;
      width: auto;
      min-height: 297mm;
    }
  }

  @media (max-width: 780px) {
    .page { width: 100%; padding: 20px; min-height: 0; }
    .cover h1 { font-size: 28px; }
    .legend-list { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-print" type="button">Print / Save as PDF</button>
</div>

<div id="pages"></div>

<script src="js/tiles.js"></script>
<script src="js/render.js"></script>
<script src="js/print.js"></script>
</body>
</html>
